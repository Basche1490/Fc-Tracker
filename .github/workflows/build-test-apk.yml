name: Build test APK

# Builds the "fctest" variant: package com.aistudio.fccareer.zqxwv.test, app name "FC Tracker (Test)".
# It installs next to the normal app and keeps its own data.
#
# To get the APK: GitHub -> Actions tab -> "Build test APK" -> newest run -> Artifacts -> FC-Tracker-test-apk
# Run it by hand with "Run workflow", or it runs on every push to a claude/* branch.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository has no Gradle wrapper, so install the Gradle version Android Gradle Plugin 9.1 needs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:assembleFctest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-Tracker-test-apk
          path: app/build/outputs/apk/fctest/*.apk
          if-no-files-found: error

name: Build test APK

# Builds the "fctest" variant: package com.aistudio.fccareer.zqxwv.test, app name "FC Tracker (Test)".
# It installs next to the normal app and keeps its own data.
#
# To get the APK: GitHub -> Actions tab -> "Build test APK" -> newest run -> Artifacts -> FC-Tracker-test-apk
# Run it by hand with "Run workflow", or it runs on every push to a claude/* branch.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository has no Gradle wrapper, so install the Gradle version Android Gradle Plugin 9.1 needs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build test APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleFctest > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            { grep -n -A 14 "What went wrong" build.log | head -40; grep -n "^e: " build.log | head -30; echo "--- end of log ---"; tail -n 25 build.log; } > errors.txt
            python3 - <<'PY'
          t = open("errors.txt", encoding="utf-8", errors="replace").read()[:3800]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle build failed::" + t)
          PY
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-Tracker-test-apk
          path: app/build/outputs/apk/fctest/*.apk
          if-no-files-found: error
